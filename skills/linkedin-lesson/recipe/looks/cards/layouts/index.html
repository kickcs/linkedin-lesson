<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1350">
    <!-- everything is local: the render does not touch the network -->
    <script src="assets/kit/gsap.min.js"></script>
    <script src="assets/kit/icons.js"></script>
    <script src="assets/kit/cards.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; background: #e9eef3; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #e9eef3; }
      .clip { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <!-- data-duration of the root and of the lesson = the lesson's DUR -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="12.4" data-width="1080" data-height="1350">
      <div id="lesson" class="clip" data-composition-id="lesson" data-composition-src="compositions/lesson.html" data-start="0" data-duration="12.4" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1350"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
