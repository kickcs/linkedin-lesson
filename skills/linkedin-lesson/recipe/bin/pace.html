<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>html, body { margin: 0; } #host { position: relative; width: 1080px; height: 1350px; overflow: hidden; }</style>
</head><body><div id="host"></div><pre id="out"></pre>
<script>
// For bin/pace.mjs: loads the scripts of the project's index.html, mounts compositions/lesson.html as HyperFrames does
// and reads what the look's engine reported in window.LessonPace: every pace call and the conclusion. Then finds the
// second the conclusion starts to fade and the timeline length. Works for any look whose engine reports there.
(async () => {
  const m = { calls: [], conclusion: null, fade: null, dur: null, error: null };
  addEventListener("error", (e) => { m.error = m.error || String(e.message || e.error); });
  window.LessonPace = { calls: [], conclusion: null };
  try {
    const page = (html) => new DOMParser().parseFromString(html, "text/html");
    const index = page(await (await fetch("/index.html")).text());
    for (const s of index.querySelectorAll("head script[src]")) {
      await new Promise((ok, fail) => {
        const sc = document.createElement("script");
        sc.src = "/" + s.getAttribute("src").replace(/^\.?\//, "");
        sc.onload = ok;
        sc.onerror = () => fail(new Error(`index.html: cannot load ${s.getAttribute("src")}`));
        document.head.appendChild(sc);
      });
    }
    const tpl = page(await (await fetch("/compositions/lesson.html")).text()).querySelector("template");
    const host = document.getElementById("host");
    for (const node of [...tpl.content.childNodes]) {
      if (node.nodeName === "SCRIPT") {
        const sc = document.createElement("script");
        sc.textContent = node.textContent;
        host.appendChild(sc);
      } else host.appendChild(document.importNode(node, true));
    }
    const P = window.LessonPace;
    m.calls = P.calls.map((r) => r.map((st) => ({ at: st.at, end: st.end, chars: st.chars, label: String(st.text[0] || "") })));
    if (P.conclusion) m.conclusion = { text: P.conclusion.text, at: P.conclusion.at };
    const tl = window.__timelines && window.__timelines.lesson;
    if (tl) {
      m.dur = tl.duration();
      const node = P.conclusion && P.conclusion.node;
      // the opacity the viewer sees: the product over the node and its parents, 0 if any of them is not displayed
      const seen = (t) => {
        tl.seek(t, false);
        let a = 1;
        for (let e = node; e && e.nodeType === 1; e = e.parentNode) {
          const cs = getComputedStyle(e);
          if (cs.display === "none") return 0;
          a *= +cs.opacity;
        }
        return a;
      };
      if (node) {
        // the fade is the first second after the conclusion stands in full when it is seen less than fully
        let t = m.conclusion.at, lo = null;
        for (; t <= m.dur; t += 0.05) {
          const a = seen(t);
          if (a >= 1) lo = t;
          else if (lo != null) break;
        }
        if (lo != null && t <= m.dur) {
          let hi = t;
          while (hi - lo > 0.002) { const mid = (lo + hi) / 2; if (seen(mid) < 1) hi = mid; else lo = mid; }
          m.fade = lo;
        }
      }
    }
  } catch (e) {
    m.error = m.error || String((e && e.message) || e);
  }
  document.getElementById("out").textContent = JSON.stringify(m);
})();
</script></body></html>
